# Builds the installers for every system.
#   - Run it by hand: Actions → "Build installers" → Run workflow (files appear as artifacts).
#   - Push a tag like v0.2.0: the same files are published as a GitHub Release.
name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - name: Installer and portable zip
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DVersion=$v" packaging\windows\shrinker.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path target\release\shrinker.exe, README.md, LICENSE -DestinationPath "dist\shrinker-$v-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Universal binary, app and disk image
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/shrinker \
            target/aarch64-apple-darwin/release/shrinker target/x86_64-apple-darwin/release/shrinker
          bash packaging/macos/build-app.sh dist/shrinker "$v"
          tar -czf "dist/shrinker-$v-macos-universal.tar.gz" -C dist shrinker
          rm -rf dist/Shrinker.app dist/shrinker
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo install cargo-deb --locked
      - name: .deb and static binary
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          cargo deb --locked --target ${{ matrix.target }} --output dist/
          cp target/${{ matrix.target }}/release/shrinker dist/shrinker
          tar -czf "dist/shrinker-$v-linux-${{ matrix.arch }}.tar.gz" -C dist shrinker
          rm dist/shrinker
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
